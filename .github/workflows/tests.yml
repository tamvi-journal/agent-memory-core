name: tests

on:
  push:
    branches: [main]
  pull_request:

# Development and smoke commands receive isolated data/profile roots from the first step.
env:
  TRAJECTA_IDENTITY_DATA_DIR: ${{ github.workspace }}/.isolation/identity-data
  TRAJECTA_IDENTITY_PROFILES: ${{ github.workspace }}/.isolation/identity-profiles

jobs:
  r3-cross-runtime:
    name: ${{ matrix.os }} / R3 X and synthetic M
    runs-on: ${{ matrix.os }}
    # Windows reached 15m after the fixed matrix and crashes, during mandatory concurrency.
    # Extend only the runner failure bound; every plan, seed and serial proof remains required.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      TMPDIR: ${{ github.workspace }}/.isolation/tmp
      TMP: ${{ github.workspace }}/.isolation/tmp
      TEMP: ${{ github.workspace }}/.isolation/tmp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Prepare isolated roots and reports
        run: python -c "from pathlib import Path; Path('.isolation/tmp').mkdir(parents=True, exist_ok=True); Path('.isolation/r3-reports').mkdir(parents=True, exist_ok=True)"
      - name: Install test helpers
        run: python -m pip install -e ".[test]"
      - name: Windows P19 and P20 end-to-end merge gate
        if: runner.os == 'Windows'
        run: python -W error::ResourceWarning -m pytest -vv -s tests/test_r3_backup_time.py tests/test_r3_windows_law.py
      - name: Focused laws and synthetic rehearsal only
        run: python -W error::ResourceWarning -m pytest -q tests/test_r3_fixture_headers.py tests/test_r3_idempotency.py tests/test_r3_allocation.py tests/test_r3_backup_time.py tests/test_r3_windows_law.py tests/test_r3_busy.py tests/test_r3_evidence.py tests/test_r3_g2.py tests/test_r3_harness.py tests/test_r3_fuzz.py tests/test_r3_usage.py tests/test_r3_rehearsal.py
      - name: X fixed matrix and all 200 seeds
        run: python tools/r3/run.py > .isolation/r3-reports/sequential.jsonl
      # Synthetic filesystem values retained only when a Windows law fails.
      - name: Diagnose Windows filesystem parity
        if: failure() && runner.os == 'Windows'
        run: python tools/r3/backup_probe.py > .isolation/r3-reports/backup-probe.jsonl
      - name: X real process kills and opposite-runtime retries
        run: python tools/r3/crashes.py > .isolation/r3-reports/crashes.json
      - name: X concurrent serializability proofs
        run: python tools/r3/concurrency.py > .isolation/r3-reports/concurrency.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r3-x-${{ matrix.os }}
          path: .isolation/r3-reports

  r3-differential:
    name: ${{ matrix.os }} / R3 Z 2000 MCP 2000 CLI 5000 kernel
    runs-on: ${{ matrix.os }}
    # Windows exhausted the former wall-clock bound before finishing its fixed budgets.
    # Every case remains mandatory; this is only the job's failure timeout (§3.2).
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      TMPDIR: ${{ github.workspace }}/.isolation/tmp
      TMP: ${{ github.workspace }}/.isolation/tmp
      TEMP: ${{ github.workspace }}/.isolation/tmp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Prepare isolated roots and reports
        run: python -c "from pathlib import Path; Path('.isolation/tmp').mkdir(parents=True, exist_ok=True); Path('.isolation/r3-reports').mkdir(parents=True, exist_ok=True)"
      - name: Every fixed-budget case and transport smokes
        run: python tools/r3/fuzz.py --report .isolation/r3-reports/z.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r3-z-${{ matrix.os }}
          path: .isolation/r3-reports

  node-conformance:
    name: ${{ matrix.os }} / node22 / read and write conformance
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Read and write conformance
        working-directory: node
        run: npm test

  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Test
        run: python -W error::ResourceWarning -m pytest -q
      - name: CLI smoke test
        shell: bash
        env:
          TRAJECTA_IDENTITY_DATA_DIR: ${{ runner.temp }}/tim
        run: |
          trajecta-identity --profile example init
          trajecta-identity --profile example retrieve "who are you" --packet
      - name: Build wheel
        run: python -m pip wheel . --no-deps -w dist

  golden-corpus:
    name: ubuntu / py3.11 / golden corpus
    runs-on: ubuntu-latest
    container:
      image: python:3.11.15-slim-bookworm@sha256:d29f48a31a8b408ed19272ca1e7b10ebae13b240a27e862d3d4217c528e2e0c3
    steps:
      - uses: actions/checkout@v4
      - name: Install and test Unicode 14 tables
        run: |
          python -m pip install -e ".[test]"
          python -m pytest -q tests/test_r0b_oracle.py tests/test_title_table.py tests/test_authority_corpus.py tests/test_r0_corpus_on_v5.py tests/test_v4_read_surfaces.py tests/test_cli_inline_consume.py

  authority-corpus:
    name: ubuntu / py3.11 / authority-v2 corpus
    runs-on: ubuntu-latest
    container:
      image: python:3.11.15-slim-bookworm@sha256:d29f48a31a8b408ed19272ca1e7b10ebae13b240a27e862d3d4217c528e2e0c3
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate authority-v2 under three hash seeds
        run: |
          set -eu
          for seed in 0 1 4294967295; do
            output="$(mktemp -d)/golden-authority-v2"
            PYTHONHASHSEED="$seed" python tools/golden_authority/generate.py --output "$output"
            diff -qr spec/golden-authority-v2 "$output"
          done

  writes-corpus:
    name: ubuntu / py3.11 / writes-v5 corpus
    runs-on: ubuntu-latest
    container:
      image: python:3.11.15-slim-bookworm@sha256:d29f48a31a8b408ed19272ca1e7b10ebae13b240a27e862d3d4217c528e2e0c3
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate writes-v5 under three hash seeds
        run: |
          set -eu
          python -m pip install -e ".[test]"
          for seed in 0 1 4294967295; do
            output="$(mktemp -d)/golden-writes-v5"
            PYTHONHASHSEED="$seed" python tools/golden_writes/generate.py --output "$output"
            diff -qr spec/golden-writes-v5 "$output"
          done

  mcp-corpus:
    name: ubuntu / py3.11 / MCP v1 corpus
    runs-on: ubuntu-latest
    container:
      image: python:3.11.15-slim-bookworm@sha256:d29f48a31a8b408ed19272ca1e7b10ebae13b240a27e862d3d4217c528e2e0c3
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate MCP v1 under three hash seeds
        run: |
          set -eu
          for seed in 0 1 4294967295; do
            output="$(mktemp -d)/golden-mcp-v1"
            PYTHONHASHSEED="$seed" python tools/golden_mcp/generate.py --output "$output"
            diff -ru spec/golden-mcp-v1 "$output"
          done

  cli-corpus:
    name: ubuntu / py3.11 / CLI v1 corpus
    runs-on: ubuntu-latest
    container:
      image: python:3.11.15-slim-bookworm@sha256:d29f48a31a8b408ed19272ca1e7b10ebae13b240a27e862d3d4217c528e2e0c3
    steps:
      - uses: actions/checkout@v4
      - name: Install and verify frozen CLI tables
        run: |
          python -m pip install -e ".[test]"
          python -m pytest -q tests/test_golden_cli.py tests/test_cli_r2d.py
      - name: Regenerate CLI v1 under three hash seeds
        run: |
          set -eu
          mkdir -p .isolation/ci
          for seed in 0 1 4294967295; do
            output="$(mktemp -d .isolation/ci/cli-XXXXXX)/golden-cli-v1"
            PYTHONHASHSEED="$seed" python tools/golden_cli/generate.py --output "$output"
            diff -ru spec/golden-cli-v1 "$output"
          done
