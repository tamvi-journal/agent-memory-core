name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node-conformance:
    name: ${{ matrix.os }} / node22 / read and write conformance
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Read and write conformance
        working-directory: node
        run: npm test

  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Test
        run: python -W error::ResourceWarning -m pytest -q
      - name: CLI smoke test
        shell: bash
        env:
          TRAJECTA_IDENTITY_DATA_DIR: ${{ runner.temp }}/tim
        run: |
          trajecta-identity --profile example init
          trajecta-identity --profile example retrieve "who are you" --packet
      - name: Build wheel
        run: python -m pip wheel . --no-deps -w dist

  golden-corpus:
    name: ubuntu / py3.11 / golden corpus
    runs-on: ubuntu-latest
    container:
      image: python:3.11.15-slim-bookworm@sha256:d29f48a31a8b408ed19272ca1e7b10ebae13b240a27e862d3d4217c528e2e0c3
    steps:
      - uses: actions/checkout@v4
      - name: Install and test Unicode 14 tables
        run: |
          python -m pip install -e ".[test]"
          python -m pytest -q tests/test_r0b_oracle.py tests/test_title_table.py tests/test_authority_corpus.py tests/test_r0_corpus_on_v5.py tests/test_v4_read_surfaces.py tests/test_cli_inline_consume.py

  authority-corpus:
    name: ubuntu / py3.11 / authority-v2 corpus
    runs-on: ubuntu-latest
    container:
      image: python:3.11.15-slim-bookworm@sha256:d29f48a31a8b408ed19272ca1e7b10ebae13b240a27e862d3d4217c528e2e0c3
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate authority-v2 under three hash seeds
        run: |
          set -eu
          for seed in 0 1 4294967295; do
            output="$(mktemp -d)/golden-authority-v2"
            PYTHONHASHSEED="$seed" python tools/golden_authority/generate.py --output "$output"
            diff -qr --exclude=MANIFEST.json spec/golden-authority-v2 "$output"
          done

  writes-corpus:
    name: ubuntu / py3.11 / writes-v5 corpus
    runs-on: ubuntu-latest
    container:
      image: python:3.11.15-slim-bookworm@sha256:d29f48a31a8b408ed19272ca1e7b10ebae13b240a27e862d3d4217c528e2e0c3
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate writes-v5 under three hash seeds
        run: |
          set -eu
          python -m pip install -e ".[test]"
          for seed in 0 1 4294967295; do
            output="$(mktemp -d)/golden-writes-v5"
            PYTHONHASHSEED="$seed" python tools/golden_writes/generate.py --output "$output"
            diff -qr spec/golden-writes-v5 "$output"
          done
